<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <!-- CSP 已去除桌面外壳的 asset: 协议，保留纯前端所需：
         img-src data:/blob: 图片（默认上传器产出 data: URL）、font-src data: KaTeX 字体、
         script-src unsafe-eval + wasm-unsafe-eval 供 mermaid。 -->
    <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob: https:; font-src 'self' data:; style-src 'self' 'unsafe-inline'; script-src 'self' 'unsafe-inline' 'unsafe-eval' 'wasm-unsafe-eval'; connect-src 'self' blob: ws://localhost:* wss://localhost:*;" />
    <title>typo-md-editor demo (React)</title>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/main.tsx"></script>
  </body>
</html>
